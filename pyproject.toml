[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dermatology-multimodal-dermoscopy"
version = "2.0.0"
description = "DermaVision-AI: Clinical & Dermoscopic Dual-Modality Fusion Engine"
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri", email = "abusuraih@example.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Security/Cryptography",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.9"
dependencies = ["pydantic>=2,<3"]

[project.optional-dependencies]
api = ["fastapi>=0.111,<1", "uvicorn>=0.30,<1"]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]

[tool.setuptools]
py-modules = ["cli", "simulator", "enrichment", "derma_vision_ai_app"]

[tool.setuptools.packages.find]
include = ["agents*", "derma_vision_ai*"]

[project.scripts]
dermatology-multimodal-dermoscopy = "derma_vision_ai.cli:main"
dermatology-multimodal-audit = "cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/dermatology-multimodal-dermoscopy"
Repository = "https://github.com/abusuraihsakhri/dermatology-multimodal-dermoscopy.git"
