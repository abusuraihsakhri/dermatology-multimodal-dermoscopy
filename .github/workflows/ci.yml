name: Test and security checks

on:
  push:
    branches: [master, main, "audit/**"]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[api,test]"
          python -m pip check
      - name: Validate Python sources
        run: python -m compileall -q agents derma_vision_ai cli.py enrichment.py simulator.py
      - name: Test Python CLI and API
        run: |
          python -m pytest -q
          dermatology-multimodal-dermoscopy --help
          dermatology-multimodal-audit --help
      - name: Test standalone browser rules
        run: |
          node --check web/app.mjs
          node --test web/app.test.mjs
