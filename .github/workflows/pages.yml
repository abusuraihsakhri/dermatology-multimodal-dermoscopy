name: Deploy standalone rule demo

on:
  push:
    branches: [master]
    paths:
      - "web/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify public HTML and JavaScript
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -eu
          for attempt in 1 2 3 4 5 6; do
            if curl --fail --location --silent --show-error --max-time 15 "$SITE_URL" -o /tmp/dermoscopy-index.html &&
               curl --fail --location --silent --show-error --max-time 15 "$SITE_URL"app.mjs -o /tmp/dermoscopy-app.mjs; then
              grep -q 'LOCAL-ONLY RULE DEMONSTRATION' /tmp/dermoscopy-index.html
              grep -q 'export function evaluatePayload' /tmp/dermoscopy-app.mjs
              echo "Published static HTML and JavaScript verified at $SITE_URL"
              exit 0
            fi
            sleep 10
          done
          echo "Pages deployment succeeded, but published assets were not reachable" >&2
          exit 1
